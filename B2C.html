<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avery Dennison – B2C Chat Flow</title>
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --wa-bg: #eae6df;
    --wa-header: #075e54;
    --wa-header-light: #128c7e;
    --wa-bubble-in: #ffffff;
    --wa-bubble-out: #dcf8c6;
    --wa-text: #111b21;
    --wa-meta: #667781;
    --wa-teal: #25d366;
    --wa-btn-bg: #ffffff;
    --wa-btn-border: #25d366;
    --wa-btn-text: #128c7e;
    --wa-divider: rgba(11,20,26,.15);
    --radius-bubble: 12px;
    --radius-btn: 22px;
    --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  body {
    font-family: var(--font);
    background: #9dbebb;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .phone-wrap {
    width: 420px;
    max-width: 100%;
    border-radius: 36px;
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0,0,0,.38), 0 0 0 10px #1a1a1a, 0 0 0 12px #333;
    display: flex;
    flex-direction: column;
    height: 780px;
    background: var(--wa-bg);
  }

  /* ── Header ── */
  .header {
    background: var(--wa-header);
    padding: 10px 16px 10px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    position: relative;
    padding-top: 44px;
  }
  .header::before {
    content: '';
    position: absolute;
    top: 14px; left: 50%; transform: translateX(-50%);
    width: 130px; height: 26px;
    background: #1a1a1a;
    border-radius: 20px;
  }
  .back-arrow { color: rgba(255,255,255,.8); font-size: 22px; cursor: pointer; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #25d366, #128c7e);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .contact-info { flex: 1; }
  .contact-name { color: #fff; font-size: 16px; font-weight: 600; line-height: 1.2; }
  .contact-status { color: rgba(255,255,255,.65); font-size: 12px; }
  .header-icons { display: flex; gap: 18px; color: rgba(255,255,255,.85); font-size: 20px; }

  /* ── Date pill ── */
  .date-pill {
    text-align: center; margin: 12px auto 4px;
    background: rgba(255,255,255,.75);
    color: var(--wa-meta); font-size: 11.5px;
    padding: 4px 12px; border-radius: 8px;
    display: inline-block; backdrop-filter: blur(4px);
  }
  .date-wrap { text-align: center; }

  /* ── Chat area ── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--wa-bg);
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23b2a99a' fill-opacity='0.12'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 4px; }

  /* ── Bubbles ── */
  .bubble-row { display: flex; flex-direction: column; max-width: 82%; }
  .bubble-row.incoming { align-self: flex-start; }
  .bubble-row.outgoing { align-self: flex-end; align-items: flex-end; }

  .bubble {
    padding: 8px 12px;
    border-radius: var(--radius-bubble);
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--wa-text);
    position: relative;
    white-space: pre-wrap;
    word-break: break-word;
    animation: popIn .2s cubic-bezier(.34,1.56,.64,1) forwards;
    opacity: 0;
  }
  @keyframes popIn {
    from { transform: scale(.88) translateY(6px); opacity: 0; }
    to   { transform: scale(1) translateY(0);   opacity: 1; }
  }

  .bubble.incoming {
    background: var(--wa-bubble-in);
    border-top-left-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }
  .bubble.outgoing {
    background: var(--wa-bubble-out);
    border-top-right-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }

  .bubble-meta {
    font-size: 11px; color: var(--wa-meta);
    margin-top: 2px; padding: 0 4px;
    display: flex; align-items: center; gap: 4px;
  }
  .bubble-row.outgoing .bubble-meta { justify-content: flex-end; }
  .tick { color: #53bdeb; font-size: 13px; }

  /* ── Options ── */
  .options-row {
    display: flex; flex-direction: column; gap: 8px;
    align-self: flex-start;
    max-width: 82%;
    animation: fadeUp .25s ease forwards;
    opacity: 0;
  }
  @keyframes fadeUp {
    from { transform: translateY(10px); opacity: 0; }
    to   { transform: translateY(0);   opacity: 1; }
  }

  .option-btn {
    background: var(--wa-btn-bg);
    border: 1.5px solid var(--wa-teal);
    color: var(--wa-btn-text);
    font-size: 14px; font-weight: 500;
    padding: 10px 18px;
    border-radius: var(--radius-btn);
    cursor: pointer;
    transition: background .15s, transform .1s, box-shadow .15s;
    text-align: left;
    line-height: 1.4;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    width: 100%;
  }
  .option-btn:hover {
    background: #f0fff5;
    box-shadow: 0 2px 8px rgba(37,211,102,.2);
    transform: translateY(-1px);
  }
  .option-btn:active { transform: scale(.97); }

  /* ── Typing indicator ── */
  .typing-bubble {
    background: var(--wa-bubble-in);
    border-radius: var(--radius-bubble);
    border-top-left-radius: 4px;
    padding: 10px 14px;
    display: inline-flex; align-items: center; gap: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
    align-self: flex-start;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--wa-meta);
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity:.6; }
    30%          { transform: translateY(-5px); opacity:1; }
  }

  /* ── Input bar ── */
  .input-bar {
    background: #f0f2f5;
    padding: 8px 12px;
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
    border-top: 1px solid var(--wa-divider);
  }
  .input-field {
    flex: 1;
    background: #fff;
    border: none; outline: none;
    border-radius: 24px;
    padding: 10px 16px;
    font-size: 15px;
    color: var(--wa-text);
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
    font-family: var(--font);
  }
  .input-field::placeholder { color: var(--wa-meta); }
  .mic-btn {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--wa-teal);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff;
    flex-shrink: 0;
    transition: background .15s, transform .1s;
  }
  .mic-btn:hover { background: #20b757; transform: scale(1.06); }

  /* ── Reset button ── */
  .reset-wrap { text-align: center; padding: 6px 0 2px; flex-shrink: 0; }
  .reset-btn {
    background: none; border: none; color: var(--wa-meta);
    font-size: 12px; cursor: pointer; text-decoration: underline;
  }
</style>
</head>
<body>

<div class="phone-wrap">
  <!-- Header -->
  <div class="header">
    <div class="back-arrow">‹</div>
    <div class="avatar">🏷️</div>
    <div class="contact-info">
      <div class="contact-name">Avery Dennison Graphics</div>
      <div class="contact-status">online</div>
    </div>
    <div class="header-icons">
      <span>📹</span>
      <span>📞</span>
      <span>⋮</span>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-area" id="chatArea">
    <div class="date-wrap"><span class="date-pill">Today</span></div>
  </div>

  <!-- Reset -->
  <div class="reset-wrap">
    <button class="reset-btn" onclick="resetFlow()">↺ Restart conversation</button>
  </div>

  <!-- Input bar (decorative) -->
  <div class="input-bar">
    <span style="font-size:22px;color:var(--wa-meta);cursor:pointer">😊</span>
    <input class="input-field" placeholder="Type a message" readonly>
    <button class="mic-btn">🎙</button>
  </div>
</div>

<script>
  const firstName = "there";
  const chat = document.getElementById('chatArea');

  // ── Flow definition ──────────────────────────────────────────
  const FLOW = {
    start: {
      msg: `Hi ${firstName}! 👋\n\nWe've received your enquiry at Avery Dennison Graphics Solutions and we're glad you reached out.\n\nTo help us assist you better, we have a couple of quick questions. Ready?`,
      options: [
        { label: "1 – YES", next: 'q2' },
        { label: "2 – NO",  next: 'no' }
      ]
    },
    q2: {
      msg: `Are you looking to get your [PPF / AWF / Car Wrapping Film] done soon or still exploring your options?`,
      options: [
        { label: "1 – Ready to go, looking for the right installer", next: 'q2_1' },
        { label: "2 – Comparing options before deciding",            next: 'q2_2' },
        { label: "3 – Just curious for now",                        next: 'q2_3' }
      ]
    },
    q2_1: {
      msg: `That's great ${firstName}!\n\nCould you please share your location or city so we can connect you with the nearest Avery Dennison certified installer right away?`,
      options: [
        { label: "Share my city", next: 'thanks' }
      ]
    },
    thanks: {
      msg: `Thank you ${firstName}! 🙌\n\nOur team will reach out to you shortly with the nearest certified installer details and guide you from there.\n\nSpeak soon!`,
      options: []
    },
    q2_2: {
      msg: `We'd love to help you make the right choice ${firstName}!\n\nOur team can share product options and details. Would you like us to send that across?`,
      options: [
        { label: "1 – Yes please", next: 'thanks' },
        { label: "2 – Maybe later", next: 'no' }
      ]
    },
    q2_3: {
      msg: `No worries ${firstName}!\n\nWhenever you're ready we're here to help. Feel free to explore our range of products and reach out anytime.\n\nHave a great day! 👋`,
      options: []
    },
    no: {
      msg: `No worries ${firstName}!\n\nWhenever you're ready we're here to help. Feel free to explore our range of products at https://graphics.averydennison.com/ap-en/home.html and reach out anytime.\n\nHave a great day! 👋`,
      options: []
    }
  };

  // ── Helpers ──────────────────────────────────────────────────
  function now() {
    const d = new Date();
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function scrollBottom() {
    setTimeout(() => chat.scrollTop = chat.scrollHeight, 50);
  }

  function removeOptions() {
    document.querySelectorAll('.options-row').forEach(el => el.remove());
  }

  function addBubble(text, side, delay = 0) {
    return new Promise(resolve => {
      setTimeout(() => {
        const row = document.createElement('div');
        row.className = `bubble-row ${side}`;

        const b = document.createElement('div');
        b.className = `bubble ${side}`;
        b.textContent = text;

        const meta = document.createElement('div');
        meta.className = 'bubble-meta';
        meta.innerHTML = side === 'outgoing'
          ? `${now()} <span class="tick">✓✓</span>`
          : now();

        row.appendChild(b);
        row.appendChild(meta);
        chat.appendChild(row);
        scrollBottom();
        resolve();
      }, delay);
    });
  }

  function showTyping(duration = 1100) {
    return new Promise(resolve => {
      const t = document.createElement('div');
      t.className = 'typing-bubble';
      t.id = 'typing';
      t.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
      chat.appendChild(t);
      scrollBottom();
      setTimeout(() => { t.remove(); resolve(); }, duration);
    });
  }

  function showOptions(options) {
    if (!options.length) return;
    const row = document.createElement('div');
    row.className = 'options-row';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt.label;
      btn.onclick = () => handleChoice(opt.label, opt.next);
      row.appendChild(btn);
    });
    chat.appendChild(row);
    scrollBottom();
  }

  async function handleChoice(label, next) {
    removeOptions();
    await addBubble(label, 'outgoing');
    await showTyping();
    await renderStep(next);
  }

  async function renderStep(key) {
    const step = FLOW[key];
    if (!step) return;
    await addBubble(step.msg, 'incoming');
    showOptions(step.options);
    scrollBottom();
  }

  // ── Init ─────────────────────────────────────────────────────
  async function startFlow() {
    await showTyping(900);
    await renderStep('start');
  }

  function resetFlow() {
    chat.innerHTML = '<div class="date-wrap"><span class="date-pill">Today</span></div>';
    startFlow();
  }

  startFlow();
</script>
</body>
</html>
