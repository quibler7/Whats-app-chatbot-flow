
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.stage {
  background: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 0 48px;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
}
.phone-frame {
  width: 393px;
  background: #1c1c1e;
  border-radius: 54px;
  padding: 12px;
  box-shadow: 0 0 0 1px #3a3a3c, 0 50px 100px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.07);
}
.dynamic-island {
  position: absolute;
  top: 22px; left: 50%; transform: translateX(-50%);
  width: 126px; height: 37px;
  background: #000; border-radius: 20px; z-index: 20;
}
.phone-screen {
  background: #111b21;
  border-radius: 44px;
  overflow: hidden;
  height: 780px;
  display: flex;
  flex-direction: column;
  position: relative;
}
.wa-header {
  background: #1f2c34;
  padding: 54px 12px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.back-btn { color: #00a884; font-size: 26px; line-height: 1; }
.back-badge {
  background: #00a884; color: #fff; font-size: 11px; font-weight: 700;
  border-radius: 10px; padding: 1px 5px; min-width: 18px; text-align: center;
}
.wa-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, #00a884, #006e5a);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 15px; font-weight: 700; flex-shrink: 0;
}
.contact-name { color: #e9edef; font-size: 15px; font-weight: 500; }
.contact-status { color: #8696a0; font-size: 12px; }
.contact-block { flex: 1; }
.header-actions { display: flex; gap: 20px; }
.hicon { color: #aebac1; font-size: 20px; }

.chat-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 8px 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  scroll-behavior: smooth;
}
.chat-area::-webkit-scrollbar { display: none; }

.date-chip {
  align-self: center;
  background: #182229;
  color: #8696a0;
  font-size: 11.5px;
  padding: 5px 12px;
  border-radius: 8px;
  margin: 6px 0;
}

.msg-row { display: flex; flex-direction: column; }
.msg-row.in { align-items: flex-start; }
.msg-row.out { align-items: flex-end; }

.bubble {
  max-width: 85%;
  padding: 7px 9px 4px;
  border-radius: 7.5px;
  font-size: 14px;
  line-height: 1.45;
  word-break: break-word;
  position: relative;
}
.bubble.in {
  background: #202c33;
  color: #e9edef;
  border-top-left-radius: 0;
}
.bubble.out {
  background: #005c4b;
  color: #e9edef;
  border-top-right-radius: 0;
}
.tail-in {
  position: absolute; top: 0; left: -8px;
  width: 0; height: 0;
  border-top: 9px solid #202c33;
  border-left: 8px solid transparent;
}
.tail-out {
  position: absolute; top: 0; right: -8px;
  width: 0; height: 0;
  border-top: 9px solid #005c4b;
  border-right: 8px solid transparent;
}
.bmeta {
  display: flex; align-items: center; justify-content: flex-end;
  gap: 3px; margin-top: 3px;
}
.btime { font-size: 11px; color: #8696a0; }
.bticks { font-size: 13px; color: #53bdeb; }

.bubble a { color: #53bdeb; }

/* WhatsApp quick-reply buttons — rendered inside chat, below bubble */
.wa-btn-group {
  max-width: 85%;
  margin-top: 2px;
  border-radius: 7.5px;
  overflow: hidden;
  border: 1px solid #2a3942;
}
.wa-qbtn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: 100%;
  padding: 11px 12px;
  background: #202c33;
  border: none;
  border-top: 1px solid #2a3942;
  color: #00a884;
  font-size: 14px;
  font-weight: 400;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.12s;
  text-align: center;
}
.wa-qbtn:first-child { border-top: none; }
.wa-qbtn:hover { background: #243038; }
.wa-qbtn:active { background: #1a252c; }
.qbtn-icon {
  display: flex; align-items: center; justify-content: center;
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid #00a884;
  font-size: 11px;
  color: #00a884;
  flex-shrink: 0;
}

.typing-bubble {
  background: #202c33;
  border-radius: 7.5px;
  border-top-left-radius: 0;
  padding: 10px 14px;
  display: flex; gap: 4px; align-items: center;
  position: relative; max-width: 85%;
}
.typing-bubble .tail-in {
  position: absolute; top: 0; left: -8px;
  width: 0; height: 0;
  border-top: 9px solid #202c33;
  border-left: 8px solid transparent;
}
.tdot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #8696a0;
  animation: td 1.4s infinite;
}
.tdot:nth-child(2) { animation-delay: 0.2s; }
.tdot:nth-child(3) { animation-delay: 0.4s; }
@keyframes td {
  0%,60%,100% { transform: translateY(0); opacity:0.4; }
  30% { transform: translateY(-5px); opacity:1; }
}

.input-bar {
  background: #1f2c34;
  padding: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.input-pill {
  flex: 1; background: #2a3942; border-radius: 24px;
  display: flex; align-items: center;
  padding: 9px 14px; gap: 8px;
}
.input-pill-txt { flex: 1; color: #8696a0; font-size: 14px; }
.mic-btn {
  width: 46px; height: 46px; border-radius: 50%;
  background: #00a884; border: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer; flex-shrink: 0;
}

.fade { animation: fi 0.25s ease both; }
@keyframes fi {
  from { opacity:0; transform:translateY(5px); }
  to { opacity:1; transform:translateY(0); }
}

.pdots { display:flex; gap:8px; justify-content:center; margin-top:20px; }
.pdot { width:8px; height:8px; border-radius:50%; background:#ccc; transition:background 0.3s; }
.pdot.on { background:#25d366; }
.hint { margin-top:12px; font-size:13px; color:#888; text-align:center; }
.rst { margin-top:10px; background:none; border:1px solid #25d366; color:#075e54; border-radius:20px; padding:6px 20px; font-size:13px; cursor:pointer; font-family:inherit; }
.rst:hover { background:#25d366; color:#fff; }
</style>

<div class="stage">
  <div class="phone-frame" style="position:relative;">
    <div class="dynamic-island"></div>
    <div class="phone-screen">
      <div class="wa-header">
        <div class="back-btn">‹</div>
        <div class="back-badge">1</div>
        <div class="wa-avatar">AD</div>
        <div class="contact-block">
          <div class="contact-name">Avery Dennison</div>
          <div class="contact-status">online</div>
        </div>
        <div class="header-actions">
          <div class="hicon">📹</div>
          <div class="hicon">📞</div>
          <div class="hicon">⋮</div>
        </div>
      </div>

      <div class="chat-area" id="chat"></div>

      <div class="input-bar">
        <div class="input-pill">
          <span style="font-size:20px;color:#8696a0;">☺</span>
          <span class="input-pill-txt">Message</span>
          <span style="font-size:20px;color:#8696a0;">📎</span>
          <span style="font-size:20px;color:#8696a0;">💲</span>
        </div>
        <button class="mic-btn">🎤</button>
      </div>
    </div>
  </div>

  <div class="pdots" id="pdots">
    <div class="pdot on"></div>
    <div class="pdot"></div>
    <div class="pdot"></div>
    <div class="pdot"></div>
    <div class="pdot"></div>
  </div>
  <div class="hint" id="hint">Tap a reply button inside the chat to walk through the flow</div>
  <button class="rst" onclick="doReset()">↺ Restart flow</button>
</div>

<script>
const chat = document.getElementById('chat');

function now() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function scroll() { setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 80); }
function setDot(n) { document.querySelectorAll('.pdot').forEach((d,i) => d.classList.toggle('on', i===n)); }
function hint(s) { document.getElementById('hint').textContent = s; }

function addChip(txt) {
  const d = document.createElement('div');
  d.className = 'date-chip fade';
  d.textContent = txt;
  chat.appendChild(d);
  scroll();
}

function addBubble(html, dir) {
  return new Promise(res => {
    const row = document.createElement('div');
    row.className = `msg-row ${dir} fade`;
    const ticks = dir === 'out' ? `<span class="bticks">✓✓</span>` : '';
    row.innerHTML = `<div class="bubble ${dir}"><div class="${dir==='in'?'tail-in':'tail-out'}"></div>${html}<div class="bmeta"><span class="btime">${now()}</span>${ticks}</div></div>`;
    chat.appendChild(row);
    scroll();
    setTimeout(res, 60);
  });
}

function showTyping() {
  return new Promise(res => {
    const row = document.createElement('div');
    row.className = 'msg-row in fade';
    row.id = 'typing';
    row.innerHTML = `<div class="typing-bubble"><div class="tail-in"></div><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div>`;
    chat.appendChild(row);
    scroll();
    setTimeout(() => { const t = document.getElementById('typing'); if(t) t.remove(); res(); }, 1300);
  });
}

function removeAllBtnGroups() {
  document.querySelectorAll('.wa-btn-group').forEach(el => el.remove());
}

function addButtons(opts) {
  removeAllBtnGroups();
  const wrap = document.createElement('div');
  wrap.className = 'msg-row in fade';
  const grp = document.createElement('div');
  grp.className = 'wa-btn-group';
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'wa-qbtn';
    btn.innerHTML = `<span class="qbtn-icon">↩</span>${o.label}`;
    btn.onclick = () => { removeAllBtnGroups(); o.fn(); };
    grp.appendChild(btn);
  });
  wrap.appendChild(grp);
  chat.appendChild(wrap);
  scroll();
}

async function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function start() {
  setDot(0);
  addChip('Today');
  await delay(400);
  await showTyping();
  await addBubble(`👋 Hi <b>Rahul</b>! So you've got a <b>Honda City in Delhi</b> and you're already thinking about giving it some love — we're here for it! 🙌<br><br>First, what are you looking to do with your car?<br><br>1 · Protect from stains & scratches <i>(PPF)</i><br>2 · Reduce heat & block UV rays <i>(AWF)</i><br>3 · Elevate your car's look <i>(Wrapping Film)</i>`, 'in');
  addButtons([
    { label: '1 — Protect from stains & scratches (PPF)', fn: pickPPF },
    { label: '2 — Reduce heat & block UV rays (AWF)', fn: pickAWF },
    { label: '3 — Elevate your car\'s look (Wrapping Film)', fn: pickWrap },
  ]);
  hint('Tap a reply button inside the chat');
}

async function pickPPF() {
  setDot(1);
  await addBubble('1', 'out');
  await showTyping();
  await addBubble(`🛡️ Your <b>Honda City</b> deserves the best protection out there!<br><br>Are you ready to get the <b>Paint Protection Film</b> installed?`, 'in');
  showReadyBtns();
}
async function pickAWF() {
  setDot(1);
  await addBubble('2', 'out');
  await showTyping();
  await addBubble(`☀️ Keep your cabin cool and shield yourself from heat and UV rays!<br><br>Are you ready to get the <b>Auto Window Film</b> installed on your Honda City?`, 'in');
  showReadyBtns();
}
async function pickWrap() {
  setDot(1);
  await addBubble('3', 'out');
  await showTyping();
  await addBubble(`🔥 Time to turn heads with your <b>Honda City</b>!<br><br>Are you ready to get the <b>Car Wrapping Film</b> done?`, 'in');
  showReadyBtns();
}

function showReadyBtns() {
  addButtons([
    { label: '1 — Ready to go 🚀', fn: goReady },
    { label: '2 — Comparing options before deciding', fn: goCompare },
    { label: '3 — Just curious for now', fn: goCompare },
  ]);
  hint('How ready are you?');
}

async function goReady() {
  setDot(2);
  await addBubble('1', 'out');
  await showTyping();
  await addBubble(`That's awesome Rahul! 🙌<br><br>Since you're in <b>Delhi</b>, we'll connect you with the nearest <b>Avery Dennison certified installer</b> right away.<br><br>Our team will reach out to you shortly and take it from there. Speak soon!<br><br>Meanwhile, feel free to explore our range of products at <a href="https://graphics.averydennison.com/ap-en/home.html" target="_blank">graphics.averydennison.com</a>`, 'in');
  setDot(4);
  hint('✅ Flow complete — user handed off to installer');
  addButtons([{ label: '↺ Restart demo', fn: doReset }]);
}

async function goCompare() {
  setDot(2);
  await addBubble('2', 'out');
  await showTyping();
  await addBubble(`We'd love to help you make the right choice, <b>Rahul</b>!<br><br>Our team can share product options and details. Would you like us to send that across?`, 'in');
  addButtons([
    { label: '1 — Yes please', fn: goYes },
    { label: '2 — Maybe later', fn: goMaybeLater },
  ]);
  hint('Send product info?');
}

async function goYes() {
  setDot(3);
  await addBubble('1 — Yes please', 'out');
  await showTyping();
  await addBubble(`That's awesome Rahul! 🙌<br><br>Since you're in <b>Delhi</b>, we'll connect you with the nearest <b>Avery Dennison certified installer</b> right away and share all the product details.<br><br>Explore our products at <a href="https://graphics.averydennison.com/ap-en/home.html" target="_blank">graphics.averydennison.com</a>`, 'in');
  setDot(4);
  hint('✅ Flow complete — details being sent');
  addButtons([{ label: '↺ Restart demo', fn: doReset }]);
}

async function goMaybeLater() {
  setDot(3);
  await addBubble('2 — Maybe later', 'out');
  await showTyping();
  await addBubble(`No worries, <b>Rahul</b>!<br><br>Whenever you're ready we're here to help. Feel free to explore our range of products at <a href="https://graphics.averydennison.com/ap-en/home.html" target="_blank">graphics.averydennison.com/ap-en/home.html</a> and reach out anytime.<br><br>Have a great day! 👋`, 'in');
  hint('Goodbye sent — automated follow-up loading...');
  await delay(2000);
  addChip('📅 1 day later — Automated follow-up');
  await delay(600);
  await showTyping();
  await addBubble(`Hey <b>Rahul</b>! 🛡️ Your <b>Honda City</b> is still waiting for that upgrade!<br><br>We just wanted to remind you that our team is here to make the process super easy for you. Shall we get started?`, 'in');
  addButtons([
    { label: '1 — Yes, let\'s do it', fn: goFollowYes },
    { label: '2 — Not yet', fn: goNotYet },
  ]);
  setDot(4);
  hint('Automated follow-up — tap to continue');
}

async function goFollowYes() {
  await addBubble("1 — Yes, let's do it", 'out');
  await showTyping();
  await addBubble(`That's awesome Rahul! 🙌<br><br>Since you're in <b>Delhi</b>, we'll connect you with the nearest <b>Avery Dennison certified installer</b> right away.<br><br>Our team will reach out shortly. Explore products at <a href="https://graphics.averydennison.com/ap-en/home.html" target="_blank">graphics.averydennison.com</a>`, 'in');
  hint('✅ Converted after follow-up!');
  addButtons([{ label: '↺ Restart demo', fn: doReset }]);
}

async function goNotYet() {
  await addBubble('2 — Not yet', 'out');
  await showTyping();
  await addBubble(`No worries, <b>Rahul</b>!<br><br>Whenever you're ready we're here to help. Feel free to explore our range of products at <a href="https://graphics.averydennison.com/ap-en/home.html" target="_blank">graphics.averydennison.com/ap-en/home.html</a> and reach out anytime.<br><br>Have a great day! 👋`, 'in');
  hint('👋 Door left open — flow complete');
  addButtons([{ label: '↺ Restart demo', fn: doReset }]);
}

function doReset() {
  chat.innerHTML = '';
  hint('Tap a reply button inside the chat to walk through the flow');
  start();
}

start();
</script>
